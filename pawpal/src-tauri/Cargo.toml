[package]
name = "pawpal"
version = "0.1.0"
description = "PawPal - a desktop cat that reacts to typing inside its own window"
authors = ["PawPal"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "pawpal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
# Tauri 构建脚本：读取 tauri.conf.json 并生成窗口/资源代码
tauri-build = { version = "=2.7.6", features = [] }

[dependencies]
# Tauri 运行时：窗口、托盘、事件。features=tray-icon 启用托盘菜单，image-png 启用 PNG 图标解码
tauri = { version = "=2.12.7", features = ["tray-icon", "image-png"] }
# 打开外部链接（当前未启用前端调用，保留插件仅为 Tauri 标准能力；无任何网络请求）
tauri-plugin-opener = "=2.7.3"
# 序列化：配置文件 JSON 校验
serde = { version = "=1.0.229", features = ["derive"] }
# JSON 构造与解析：配置文件读写
serde_json = "=1.0.154"

# 说明：已移除 rdev。本版本无任何全局输入监听 API，
# 键鼠事件仅来自应用窗口自身的 DOM 事件。
